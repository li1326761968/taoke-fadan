name: Build EXE
on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pyinstaller
      - run: pyinstaller --onefile --windowed --name taoke-fadan --hidden-import=zhetaoke_api --hidden-import=copy_generator --hidden-import=napcat_sender --hidden-import=qq_monitor --hidden-import=jd_union_api --hidden-import=auto_updater --hidden-import=license main.py
      - run: if (Test-Path config.json) { Copy-Item config.json dist/config.json }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/taoke-fadan.exe
            dist/config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
